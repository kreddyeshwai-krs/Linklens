<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Link Lens</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-primary); padding: 1rem;">
  <div class="card" style="max-width: 440px; width: 100%;">
    <div class="card-header" style="text-align: center; flex-direction: column; gap: 0.5rem; padding: 2rem 1.5rem 1rem;">
      <a href="/index.html" class="brand-logo" style="justify-content: center;">
        <div class="brand-icon">🔍</div>
        <span>Link Lens</span>
      </a>
      <h2 style="font-size: 1.35rem; margin-top: 0.5rem;">Create Your Account</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Start training in the URL Intelligence Simulator</p>
    </div>
    <div class="card-body">
      <div id="signup-error-alert" class="card" style="display: none; background-color: var(--risk-critical-bg); border-color: var(--risk-critical-border); color: var(--risk-critical); padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.88rem;"></div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="signup-name">Display Name / Alias</label>
          <input class="form-control" type="text" id="signup-name" required placeholder="Security Analyst" minlength="2">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input class="form-control" type="email" id="signup-email" required placeholder="analyst@domain.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Password (min 8 chars)</label>
          <input class="form-control" type="password" id="signup-password" required minlength="8" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button type="submit" id="signup-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
      </form>
    </div>
    <div class="card-footer" style="justify-content: center; font-size: 0.88rem;">
      <span>Already have an account? <a href="/login.html">Sign In</a></span>
    </div>
  </div>

  <script type="module">
    import { initTheme } from '/js/theme.js';
    import { signup, getCurrentUser } from '/js/auth.js';
    import { showToast } from '/js/ui-utils.js';

    initTheme();

    getCurrentUser().then(user => {
      if (user) window.location.href = '/dashboard.html';
    });

    const form = document.getElementById('signup-form');
    const nameInput = document.getElementById('signup-name');
    const emailInput = document.getElementById('signup-email');
    const passwordInput = document.getElementById('signup-password');
    const submitBtn = document.getElementById('signup-submit-btn');
    const errorAlert = document.getElementById('signup-error-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        await signup(emailInput.value.trim(), passwordInput.value, nameInput.value.trim());
        showToast('Account registered successfully', 'success');
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorAlert.textContent = err.message || 'Signup failed. Please check your details.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
